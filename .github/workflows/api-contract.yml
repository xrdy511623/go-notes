name: API Contract

on:
  pull_request:
    paths:
      - 'goprincipleandpractise/api-design/**'
      - '.github/workflows/api-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'goprincipleandpractise/api-design/**'
      - '.github/workflows/api-contract.yml'

jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: OpenAPI lint and breaking check
        run: go test ./goprincipleandpractise/api-design/contract -v

      - name: API behavior tests
        run: go test ./goprincipleandpractise/api-design/restful ./goprincipleandpractise/api-design/grpc -v
